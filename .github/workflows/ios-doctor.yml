name: Build AE Doctor iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "AE-Doctor/**"
      - ".github/workflows/ios-doctor.yml"

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project AE-Doctor/AE-Doctor.xcodeproj \
            -scheme AE-Doctor \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
